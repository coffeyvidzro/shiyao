services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shiyao
      POSTGRES_USER: shiyao
      POSTGRES_PASSWORD: shiyao_dev_password
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiyao -d shiyao"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiyao-control

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiyao-control

  nats:
    image: nats:2.14.3-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data/nats
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiyao-control

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SHIYAO_UPSTREAM: host.docker.internal:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shiyao-control

networks:
  shiyao-control:
    name: shiyao-control
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  nats-data:
  caddy-data:
  caddy-config:
