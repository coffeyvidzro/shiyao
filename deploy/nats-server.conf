server_name: shiyao-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/nats/jetstream
  max_mem_store: 256Mb
  max_file_store: 2Gb
}

accounts {
  SYS: {
    users: [
      { user: "sys", password: "sys_dev_password" }
    ]
  }

  SHIYAO: {
    jetstream: enabled
    users: [
      { user: "shiyao", password: "shiyao_dev_password" }
    ]
  }
}

system_account: SYS
