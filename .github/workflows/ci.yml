name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: shiyao/go.mod
          cache-dependency-path: shiyao/go.sum

      - name: Test
        working-directory: shiyao
        run: go test ./...

      - name: Build binaries
        working-directory: shiyao
        run: go build ./cmd/...
